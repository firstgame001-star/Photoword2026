<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#061d2c"><title>PhotoWord</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
*{box-sizing:border-box}body{margin:0;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#062334 url('https://images.unsplash.com/photo-1665423479552-1ea5f5500e37?auto=format&fit=crop&w=1600&q=85') center/cover fixed no-repeat}body:before{content:"";position:fixed;inset:0;background:#031b2a99;z-index:-1}.wrap{max-width:500px;min-height:100vh;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 16px 28px}.head{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:9px}.back{height:40px;border:0;border-radius:10px;background:#0b3348;color:#fff;font-size:30px}.head b,.head small{display:block}.head small{color:#a9c0ca}.coins{background:#08283d;border:1px solid #3d6679;border-radius:12px;padding:8px 10px;font-weight:800}.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.photo{aspect-ratio:1;border:2px solid #fff;border-radius:14px;background:linear-gradient(145deg,#c3a369,#71884d);display:grid;place-items:center;font-size:72px}.slots{display:flex;justify-content:center;gap:6px;margin:28px 0}.slot{width:42px;height:47px;border-radius:8px;background:#0a3149;border:1px solid #3d7697;display:grid;place-items:center;font-size:23px;font-weight:900}.slots.wrong .slot{background:#8c2635;border-color:#ff6579}.letters{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.letter{aspect-ratio:1;border:0;border-radius:8px;background:linear-gradient(#fff,#d8e1e8);color:#0b263a;font-size:22px;font-weight:900;box-shadow:0 3px #899aa7}.letter.used{opacity:.2}.letter.removed{visibility:hidden}.tools{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.tool{border:0;border-radius:10px;color:#fff;padding:11px 14px;font-weight:900;font-size:16px;background:#20ae3e}.tool:nth-child(2){background:#dda31c}.tool:nth-child(3){background:#1590cc}.textHint{margin-top:18px;border:1px solid #34718d;background:#082b3e;border-radius:13px;padding:13px;cursor:pointer}.textHint span{float:right;color:#ffd052;font-weight:900}.textHint small{display:block;color:#9bb4c0;margin-top:4px}.toast{display:none;position:fixed;z-index:9999;left:50%;bottom:100px;transform:translateX(-50%);background:#061d2cf5;border:1px solid #40d6ff;border-radius:12px;padding:11px 15px;font-weight:800;white-space:nowrap}
</style></head><body><div class="wrap"><div class="head"><button class="back" id="back">‹</button><div><b>Глава 1</b><small>Разминка · Уровень 1 из 20</small></div><div class="coins">🪙 <span id="coins">250</span></div></div><div class="photos"><div class="photo">🐕</div><div class="photo">🥣</div><div class="photo">🦴</div><div class="photo">🐾</div></div><div class="slots" id="slots"></div><div class="letters" id="letters"></div><div class="tools"><button class="tool" id="letterHint">💡 50</button><button class="tool" id="removeHint">🪄 100</button><button class="tool" id="shuffle">🔀</button></div><div class="textHint" id="textHint">💬 <b>Текстовая подсказка</b><span>150 🪙</span><small id="hintValue">Нажми, чтобы получить подсказку</small></div><div class="toast" id="toast"></div></div><script src="game-v1.js"></script></body></html>
