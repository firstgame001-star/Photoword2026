name: Test live PhotoWord entries
on:
  push:
    branches: [main, audit/photoword-comprehensive-oct-2026]
    paths: ['index.html', 'app/index.html', 'game.html', 'app/game.html', '404.html', 'clean/**', 'scripts/test-live-entries.py', '.github/workflows/test-live-entries.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photoword-live-entry-tests
  cancel-in-progress: true
jobs:
  mobile-browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install browser tests
        run: |
          sudo python - <<'PYAPT'
          from pathlib import Path
          for name, uri in [('apt-mirrors.txt','https://archive.ubuntu.com/ubuntu'),('apt-security-mirrors.txt','https://security.ubuntu.com/ubuntu')]:
              path=Path('/etc/apt')/name
              if path.exists(): path.write_text(uri+'\n')
          paths=list(Path('/etc/apt/sources.list.d').glob('*.sources'))+list(Path('/etc/apt/sources.list.d').glob('*.list'))+[Path('/etc/apt/sources.list')]
          for path in paths:
              if path.exists(): path.write_text(path.read_text().replace('http://azure.archive.ubuntu.com/ubuntu','https://archive.ubuntu.com/ubuntu').replace('https://azure.archive.ubuntu.com/ubuntu','https://archive.ubuntu.com/ubuntu'))
          PYAPT
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium webkit
      - name: Open actual public Pages URLs and tap controls
        run: PW_SKIP_COMMERCE=1 python scripts/test-live-entries.py
      - name: Save browser test evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: photoword-mobile-browser-check
          path: test-results/
          retention-days: 7
