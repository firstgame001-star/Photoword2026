name: Test two PhotoWord devices
on:
  push:
    branches: [main]
    paths: ['scripts/test-two-devices.py', 'scripts/two-device-batches.json', '.github/workflows/test-two-devices.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  two-mobile-sessions:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install mobile browsers
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium webkit
      - name: Check two independent mobile sessions
        run: python scripts/test-two-devices.py
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: photoword-two-devices
          path: test-results/two-devices/
          retention-days: 7
