name: Check PhotoWord content and input
on:
  pull_request:
    paths: ['clean/**', 'scripts/**', '.github/workflows/test-content.yml']
  push:
    branches: [main]
    paths: ['clean/**', 'scripts/**', '.github/workflows/test-content.yml']
permissions:
  contents: read
jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: node scripts/check-clean.mjs
      - run: node scripts/full-audit.mjs
      - run: node scripts/audit-content-clues.mjs
      - run: node scripts/audit-ambiguous-clues.mjs
      - run: node scripts/test-repeat-policy.mjs
      - run: node scripts/test-challenge-server-input.mjs
      - run: node scripts/test-independent-challenge-puzzles.mjs
      - run: node scripts/test-challenge-auth-preview.mjs
      - run: node scripts/test-anticheat-contract.mjs
      - run: node scripts/test-bot-behavior-contract.mjs
      - run: node scripts/test-bot-alert-dispatch.mjs
      - run: node scripts/test-api-rate-guard.mjs
      - run: node scripts/test-anticheat-endpoints.mjs
      - run: node scripts/test-duel-input.mjs
      - run: node scripts/test-two-client-duel.mjs
      - run: node scripts/test-daily-input.mjs
      - run: node scripts/test-ad-session.mjs
      - run: node scripts/test-background-music.mjs
      - run: node scripts/test-temporary-one-star-pack.mjs
      - run: node scripts/test-stars-language.mjs
      - run: node scripts/test-embedded-terms.mjs
      - run: node scripts/test-adsgram-callback.mjs
