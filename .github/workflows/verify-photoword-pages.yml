name: Verify PhotoWord Pages
on:
  push:
    branches: [main]
    paths: ['clean/**', 'scripts/check-clean.mjs', 'scripts/full-audit.mjs', '.github/workflows/verify-photoword-pages.yml']
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: photoword-public-check
  cancel-in-progress: true
jobs:
  public-site-check:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify repository clean build
        run: |
          node scripts/check-clean.mjs
          node scripts/full-audit.mjs
      - name: Wait for r75 and verify published files
        shell: bash
        run: |
          set -euo pipefail
          base='https://firstgame001-star.github.io/Photoword2026/clean'
          release='20260928-r79'
          ok=0
          for i in $(seq 1 48); do
            if curl --fail --silent --show-error --location --max-time 20 "$base/release.json?check=$i" -o "$RUNNER_TEMP/release.json" && grep -q "$release" "$RUNNER_TEMP/release.json"; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
          for file in index.html game.html theme-game.html core.js home.js game.js main-levels-8-9.js theme-game.js challenge-bank-extra.js challenge.js ui.css privacy.html terms.html release.json; do
            curl --fail --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 3 --max-time 30 "$base/$file?r=$release" -o "$RUNNER_TEMP/$file"
            echo "HTTP 200: $file"
          done
          grep -q 'chapter1Select' "$RUNNER_TEMP/index.html"
          grep -q '1–20' "$RUNNER_TEMP/index.html"
          grep -q 'chapter2Select' "$RUNNER_TEMP/index.html"
          grep -q '21–50' "$RUNNER_TEMP/index.html"
          grep -q 'chapter3Select' "$RUNNER_TEMP/index.html"
          grep -q '51–90' "$RUNNER_TEMP/index.html"
          grep -q 'chapter4Select' "$RUNNER_TEMP/index.html"
          grep -q '91–131' "$RUNNER_TEMP/index.html"
          grep -q '131:{' "$RUNNER_TEMP/game.js"
          grep -q 'for(let n=1;n<=380;n++)' "$RUNNER_TEMP/game.js"
          grep -q 'levelId===131' "$RUNNER_TEMP/game.js"
          grep -q '132–180' "$RUNNER_TEMP/index.html"
          grep -q '132:{' "$RUNNER_TEMP/game.js"
          grep -q '180:{' "$RUNNER_TEMP/game.js"
          grep -q 'levelId===180' "$RUNNER_TEMP/game.js"
          grep -q '181–230' "$RUNNER_TEMP/index.html"
          grep -q '181:{' "$RUNNER_TEMP/game.js"
          grep -q '230:{' "$RUNNER_TEMP/game.js"
          grep -q 'levelId===230' "$RUNNER_TEMP/game.js"
          grep -q '231–280' "$RUNNER_TEMP/index.html"
          grep -q '231:{' "$RUNNER_TEMP/game.js"
          grep -q '280:{' "$RUNNER_TEMP/game.js"
          grep -q 'levelId===280' "$RUNNER_TEMP/game.js"
          grep -q '"id": 281' "$RUNNER_TEMP/main-levels-8-9.js"
          grep -q '"id": 330' "$RUNNER_TEMP/main-levels-8-9.js"
          grep -q '"id": 331' "$RUNNER_TEMP/main-levels-8-9.js"
          grep -q '"id": 380' "$RUNNER_TEMP/main-levels-8-9.js"
          grep -q 'levelId===330' "$RUNNER_TEMP/game.js"
          grep -q 'levelId===380' "$RUNNER_TEMP/game.js"
          grep -q '281–330' "$RUNNER_TEMP/index.html"
          grep -q '331–380' "$RUNNER_TEMP/index.html"
          grep -q '"main_answers_unique_all_languages":true' "$RUNNER_TEMP/release.json"
          grep -q 'chapter12Select' "$RUNNER_TEMP/index.html"
          grep -q 'data-home-chapter="12"' "$RUNNER_TEMP/index.html"
          grep -q 'id="profileTitle"' "$RUNNER_TEMP/index.html"
          grep -q 'shownChapterLevel' "$RUNNER_TEMP/home.js"
          ! grep -q 'requestAnimationFrame(()=>showHomeChapter' "$RUNNER_TEMP/home.js"
          grep -q '#chapter12Select' "$RUNNER_TEMP/ui.css"
          grep -q 'themes-entry-featured' "$RUNNER_TEMP/index.html"
          grep -q 'id="challengeModes"' "$RUNNER_TEMP/index.html"
          grep -q 'data-challenge="limited"' "$RUNNER_TEMP/index.html"
          grep -q 'data-challenge="nohint"' "$RUNNER_TEMP/index.html"
          grep -q 'data-challenge="blitz"' "$RUNNER_TEMP/index.html"
          grep -q 'const CHALLENGE_MODE=' "$RUNNER_TEMP/home.js"
          grep -q 'id="challengeScreen"' "$RUNNER_TEMP/index.html"
          grep -q 'ENERGY_MAX=5' "$RUNNER_TEMP/challenge.js"
          ! grep -q 'reserve_energy' "$RUNNER_TEMP/challenge.js"
          grep -q '"base_energy_max":5' "$RUNNER_TEMP/release.json"
          grep -q 'data-energy-store-pack="e1"' "$RUNNER_TEMP/index.html"
          grep -q 'data-energy-store-pack="e5"' "$RUNNER_TEMP/index.html"
          ! grep -q 'data-energy-pack="e10"' "$RUNNER_TEMP/index.html"
          ! grep -q 'data-energy-pack="e20"' "$RUNNER_TEMP/index.html"
          grep -q 'deadline+=3000' "$RUNNER_TEMP/challenge.js"
          grep -q 'deadline-=3000' "$RUNNER_TEMP/challenge.js"
          grep -q 'syncTrustedClock' "$RUNNER_TEMP/challenge.js"
          grep -q 'trustedNow' "$RUNNER_TEMP/challenge.js"
          grep -q 'performance.now()+60000' "$RUNNER_TEMP/challenge.js"
          grep -q "🛡️" "$RUNNER_TEMP/challenge.js"
          grep -q "💥" "$RUNNER_TEMP/challenge.js"
          grep -q 'id="blitzLetterHint"' "$RUNNER_TEMP/index.html"
          grep -q 'id="blitzRemoveHint"' "$RUNNER_TEMP/index.html"
          grep -q 'id="blitzTextHint"' "$RUNNER_TEMP/index.html"
          grep -q "−75" "$RUNNER_TEMP/challenge.js"
          grep -q "−125" "$RUNNER_TEMP/challenge.js"
          grep -q "−200" "$RUNNER_TEMP/challenge.js"
          grep -q 'id="challengeCorrectPanel"' "$RUNNER_TEMP/index.html"
          grep -q 'id="challengeCorrectNext"' "$RUNNER_TEMP/index.html"
          grep -q "correctWord:'Верно!'" "$RUNNER_TEMP/challenge.js"
          grep -q "nextWord:'ДАЛЬШЕ'" "$RUNNER_TEMP/challenge.js"
          grep -q 'function showRequiredLanguagePicker(){if(getLang())return;' "$RUNNER_TEMP/home.js"
          grep -q "pw.profileSyncedShown" "$RUNNER_TEMP/home.js"
          grep -q '"question_bank":{"total":400' "$RUNNER_TEMP/release.json"
          grep -q 'PW_CHALLENGE_EXTRA' "$RUNNER_TEMP/challenge-bank-extra.js"
          grep -q "BANK_VERSION='r54-400'" "$RUNNER_TEMP/challenge.js"
          grep -q 'pw.challenge.deck.' "$RUNNER_TEMP/challenge.js"
          grep -q 'challengeResultReward' "$RUNNER_TEMP/challenge.js"
          grep -q 'rewarded_runs_today' "$RUNNER_TEMP/challenge.js"
          grep -q '"challenge_rewards_live":true' "$RUNNER_TEMP/release.json"
          grep -q '12 тем · 1200 уровней' "$RUNNER_TEMP/index.html"
          ! grep -q 'id="tasksBtn"' "$RUNNER_TEMP/index.html"
          grep -q 'data-coins' "$RUNNER_TEMP/theme-game.html"
          grep -q 'THEME_REWARD_COINS=15,THEME_REWARD_XP=10' "$RUNNER_TEMP/theme-game.js"
          grep -q 'HINT_COSTS={letter:50,remove:100,text:150}' "$RUNNER_TEMP/theme-game.js"
          ! grep -q 'id="themeSettingsBtn"' "$RUNNER_TEMP/theme-game.html"
          grep -q 'const ART_LEVELS={' "$RUNNER_TEMP/theme-game.js"
          grep -q 'const ART_TRANSLATED={' "$RUNNER_TEMP/theme-game.js"
          grep -q 'const PROF_LEVELS=' "$RUNNER_TEMP/theme-game.js"
          grep -q 'const PROF_TRANSLATED=' "$RUNNER_TEMP/theme-game.js"
          grep -q 'const TRAVEL_LEVELS=' "$RUNNER_TEMP/theme-game.js"
          grep -q 'const TRAVEL_TRANSLATED=' "$RUNNER_TEMP/theme-game.js"
          grep -q 'const SCIENCE_LEVELS=' "$RUNNER_TEMP/theme-game.js"
          grep -q 'const SCIENCE_TRANSLATED=' "$RUNNER_TEMP/theme-game.js"
          grep -q 'const TECHNOLOGY_LEVELS=' "$RUNNER_TEMP/theme-game.js"
          grep -q 'const TECHNOLOGY_TRANSLATED=' "$RUNNER_TEMP/theme-game.js"
          grep -Fq "['sport','art','professions','travel','science','technology'].includes(themeParam)" "$RUNNER_TEMP/theme-game.js"
          grep -q "pw.themeProgress.'+themeId" "$RUNNER_TEMP/theme-game.js"
          grep -q '"id":"art","levels":100,"available_through":100,"status":"complete"' "$RUNNER_TEMP/release.json"
          grep -q '"id":"professions","levels":100,"available_through":100,"status":"complete"' "$RUNNER_TEMP/release.json"
          grep -q '"id":"travel","levels":100,"available_through":100,"status":"complete"' "$RUNNER_TEMP/release.json"
          grep -q '"id":"science","levels":100,"available_through":100,"status":"complete"' "$RUNNER_TEMP/release.json"
          grep -q '"id":"technology","levels":100,"available_through":100,"status":"complete"' "$RUNNER_TEMP/release.json"
          grep -q '"thematic_answers_unique_across_ready_categories":true' "$RUNNER_TEMP/release.json"
          grep -q '"server_authoritative":true' "$RUNNER_TEMP/release.json"
          grep -q '"first_completion":{"coins":15,"xp":10}' "$RUNNER_TEMP/release.json"
          grep -q '"hints":{"letter":50,"remove":100,"text":150,"shuffle":0}' "$RUNNER_TEMP/release.json"
          grep -q "theme_complete" "$RUNNER_TEMP/theme-game.js"
          grep -q "theme_hint" "$RUNNER_TEMP/theme-game.js"
          grep -q '💡 50' "$RUNNER_TEMP/theme-game.html"
          grep -q '🪄 100' "$RUNNER_TEMP/theme-game.html"
          grep -q '150 🪙' "$RUNNER_TEMP/theme-game.html"
          grep -q 'privacy.html' "$RUNNER_TEMP/index.html"
          grep -q 'terms.html' "$RUNNER_TEMP/index.html"
          grep -q "$release" "$RUNNER_TEMP/release.json"
          node --check "$RUNNER_TEMP/core.js"
          node --check "$RUNNER_TEMP/home.js"
          node --check "$RUNNER_TEMP/game.js"
          node --check "$RUNNER_TEMP/main-levels-8-9.js"
          node --check "$RUNNER_TEMP/theme-game.js"
          node --check "$RUNNER_TEMP/challenge.js"
          printf '### PhotoWord r77 publication check\n\nMain levels 1–380, Chapters 1–12, Chapters 8–9 live through level 380, server-authoritative challenge rewards, full DOM/localization/theme audit, server-authoritative thematic +15 coin rewards and paid hints, unique main answers in RU/EN/AZ, unique backgrounds, absolute chapter progress and earned titles, featured thematic mode, Sport 1–100, Art 1–100, Professions 1–100, Travel 1–100, Science 1–100 and Technology 1–100, three playable challenge modes with server-authoritative time and paid Blitz hints, explicit next-step feedback, 400 challenge words with no repeats until the bank is exhausted, and fixed language selection, legal/settings surfaces and JavaScript all verified.\n' >> "$GITHUB_STEP_SUMMARY"
