name: Verify PhotoWord Pages
on:
  push:
    branches: [main]
    paths: ['clean/**', '.github/workflows/verify-photoword-pages.yml']
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: photoword-public-check
  cancel-in-progress: true
jobs:
  public-site-check:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check published pages and every required asset
        shell: bash
        run: |
          set -euo pipefail
          base='https://firstgame001-star.github.io/Photoword2026/clean'
          for file in index.html game.html core.js home.js game.js ui.css release.json; do
            curl --fail --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 5 --max-time 30 "$base/$file" -o "$RUNNER_TEMP/$file"
            echo "HTTP 200: $file"
          done
          curl --fail --silent --show-error --location --max-time 30 "$base/" -o "$RUNNER_TEMP/entry.html"
          grep -q '20260926-r8' "$RUNNER_TEMP/release.json"
          grep -q './home.js' "$RUNNER_TEMP/entry.html"
          grep -q './core.js' "$RUNNER_TEMP/game.html"
          grep -q 'https://telegram.org/js/telegram-web-app.js' "$RUNNER_TEMP/entry.html"
          node --check "$RUNNER_TEMP/core.js"
          node --check "$RUNNER_TEMP/home.js"
          node --check "$RUNNER_TEMP/game.js"
          printf '### PhotoWord publication check\n\n/clean/, both pages and all required assets returned HTTP 200.\n' >> "$GITHUB_STEP_SUMMARY"
