name: Verify PhotoWord Pages
on:
  push:
    branches: [main]
    paths: ['clean/**', '.github/workflows/verify-photoword-pages.yml']
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: photoword-public-check
  cancel-in-progress: true
jobs:
  public-site-check:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for r11 and verify published files
        shell: bash
        run: |
          set -euo pipefail
          base='https://firstgame001-star.github.io/Photoword2026/clean'
          ok=0
          for i in $(seq 1 36); do
            if curl --fail --silent --show-error --location --max-time 20 "$base/release.json?check=$i" -o "$RUNNER_TEMP/release.json" && grep -q '20260926-r11' "$RUNNER_TEMP/release.json"; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
          for file in index.html game.html core.js home.js game.js ui.css privacy.html terms.html release.json; do
            curl --fail --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 3 --max-time 30 "$base/$file?r=20260926-r11" -o "$RUNNER_TEMP/$file"
            echo "HTTP 200: $file"
          done
          grep -q './home.js' "$RUNNER_TEMP/index.html"
          grep -q './core.js' "$RUNNER_TEMP/game.html"
          grep -q 'privacy.html' "$RUNNER_TEMP/index.html"
          grep -q 'terms.html' "$RUNNER_TEMP/index.html"
          grep -q 'https://telegram.org/js/telegram-web-app.js' "$RUNNER_TEMP/index.html"
          node --check "$RUNNER_TEMP/core.js"
          node --check "$RUNNER_TEMP/home.js"
          node --check "$RUNNER_TEMP/game.js"
          printf '### PhotoWord r11 publication check\n\nPublic pages and required assets returned HTTP 200 and JavaScript parsed successfully.\n' >> "$GITHUB_STEP_SUMMARY"
