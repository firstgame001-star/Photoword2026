name: Full PhotoWord audit without purchases and video
on:
  push:
    branches: [main]
    paths: ['clean/**', 'scripts/**', '.github/workflows/full-game-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-game-audit:
    strategy:
      fail-fast: false
      matrix:
        script: [test-live-entries.py, test-daily-browser.py, test-achievements-browser.py, test-two-devices.py]
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install browsers
        run: |
          sudo python - <<'PYAPT'
          from pathlib import Path
          for name, uri in [('apt-mirrors.txt','https://archive.ubuntu.com/ubuntu'),('apt-security-mirrors.txt','https://security.ubuntu.com/ubuntu')]:
              path=Path('/etc/apt')/name
              if path.exists(): path.write_text(uri+'\n')
          paths=list(Path('/etc/apt/sources.list.d').glob('*.sources'))+list(Path('/etc/apt/sources.list.d').glob('*.list'))+[Path('/etc/apt/sources.list')]
          for path in paths:
              if path.exists(): path.write_text(path.read_text().replace('http://azure.archive.ubuntu.com/ubuntu','https://archive.ubuntu.com/ubuntu').replace('https://azure.archive.ubuntu.com/ubuntu','https://archive.ubuntu.com/ubuntu'))
          PYAPT
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium webkit
      - name: Check game without purchases or video
        env:
          PW_SKIP_COMMERCE: '1'
        run: python scripts/${{ matrix.script }}
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: audit-${{ matrix.script }}
          path: test-results/
          retention-days: 7
