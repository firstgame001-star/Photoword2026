const L={ru:{t:'Политика конфиденциальности',d:'Версия 26.09.2026',c:`
<h2>1. Какие данные используются</h2><p>Для входа Mini App получает подписанные Telegram данные, которые могут включать Telegram ID, имя, фамилию, username, фото профиля и параметр запуска. Мы создаём внутренний PhotoWord ID.</p>
<p>Также сохраняются игровой прогресс, XP, текущий уровень, количество пройденных уровней, баланс монет, история игровых наград и подсказок, ежедневные награды, задания и реферальные связи.</p>
<p>При оплате Telegram Stars мы сохраняем идентификатор подтверждённого платежа, пакет, количество Stars и начисленных монет. Данные банковской карты или платёжного средства нам не передаются.</p>
<h2>2. Локальные настройки</h2><p>Язык, тема, звук, вибрация и музыка могут храниться локально на устройстве в WebView Telegram.</p>
<h2>3. Для чего нужны данные</h2><p>Для авторизации, сохранения прогресса, рейтинга, начисления и списания монет, предотвращения повторных наград и платежей, работы рефералов, магазина и улучшения игры.</p>
<h2>4. Сервисы</h2><p>Игра работает внутри Telegram. Серверная игровая информация хранится в Supabase. Статические файлы приложения публикуются через GitHub Pages. Рекламная сеть сейчас не подключена; перед её подключением политика будет обновлена.</p>
<h2>5. Рейтинг и публичность</h2><p>В рейтинге могут отображаться игровое имя/Telegram имя, PhotoWord ID, XP и игровой прогресс. Telegram ID публично не показывается.</p>
<h2>6. Безопасность</h2><p>Сервер проверяет подпись Telegram Mini App initData. Платные монеты начисляются только после серверного подтверждения Telegram Stars. Идентификаторы подтверждённых платежей защищены от повторного начисления.</p>
<h2>7. Уведомления</h2><p>Бот может писать пользователю только после предоставления разрешения Telegram. Разрешение запрашивается системным интерфейсом Telegram.</p>
<h2>8. Сброс прогресса</h2><p>Сброс удаляет уровни, XP и позицию в рейтинге и возвращает игру к уровню 1. Монеты, история оплат Stars и уже полученных наград сохраняются, чтобы не потерять оплаченные покупки и не позволить получать одну награду повторно.</p>
<h2>9. Удаление аккаунта</h2><p>Полный механизм удаления аккаунта будет добавлен до публичного запуска. До этого момента приложение находится в стадии разработки. Контакт поддержки также будет опубликован перед публичным запуском.</p>
<h2>10. Изменения</h2><p>Политика может обновляться при появлении новых функций, рекламы, аналитики или способов оплаты.</p>`},
en:{t:'Privacy Policy',d:'Version 26 Sep 2026',c:`
<h2>1. Data we use</h2><p>For login, the Mini App receives signed Telegram data that may include Telegram ID, first and last name, username, profile photo and launch parameter. We create an internal PhotoWord ID.</p>
<p>We also store game progress, XP, current level, completed levels, coin balance, reward and hint history, daily rewards, tasks and referral relationships.</p>
<p>For Telegram Stars payments we store the confirmed payment identifier, package, Stars amount and credited coins. We do not receive card or bank payment details.</p>
<h2>2. Local preferences</h2><p>Language, theme, sound, haptics and music may be stored locally in the Telegram WebView.</p>
<h2>3. Purposes</h2><p>Authentication, progress saving, leaderboard, coin accounting, duplicate-reward/payment prevention, referrals, shop operation and game improvement.</p>
<h2>4. Services</h2><p>The game runs inside Telegram. Server game data is stored in Supabase. Static app files are published with GitHub Pages. No advertising network is active yet; this policy will be updated before ads are enabled.</p>
<h2>5. Leaderboard</h2><p>The leaderboard may display game/Telegram name, PhotoWord ID, XP and progress. Telegram ID is not public.</p>
<h2>6. Security</h2><p>The server verifies Telegram Mini App initData signatures. Paid coins are credited only after server-confirmed Telegram Stars payments, with duplicate payment protection.</p>
<h2>7. Notifications</h2><p>The bot may message a user only after Telegram write access is granted through Telegram's system permission flow.</p>
<h2>8. Progress reset</h2><p>Reset removes completed levels, XP and leaderboard position and restarts from level 1. Coins, Stars purchase records and previously claimed reward history are retained.</p>
<h2>9. Account deletion</h2><p>A full account deletion flow will be added before public launch. The app is currently under development, and a support contact will be published before public launch.</p>
<h2>10. Changes</h2><p>This policy may change when new functions, ads, analytics or payment methods are added.</p>`},
az:{t:'Məxfilik siyasəti',d:'Versiya 26.09.2026',c:`
<h2>1. İstifadə olunan məlumatlar</h2><p>Giriş üçün Mini App imzalanmış Telegram məlumatlarını alır. Bunlara Telegram ID, ad, soyad, username, profil şəkli və başlanğıc parametri daxil ola bilər. Daxili PhotoWord ID yaradılır.</p>
<p>Oyun tərəqqisi, XP, cari səviyyə, keçilmiş səviyyələr, sikkə balansı, mükafat və ipucu tarixçəsi, gündəlik mükafatlar, tapşırıqlar və referral əlaqələri də saxlanılır.</p>
<p>Telegram Stars ödənişlərində təsdiqlənmiş ödəniş identifikatoru, paket, Stars miqdarı və verilən sikkələr saxlanılır. Bank kartı məlumatları bizə ötürülmür.</p>
<h2>2. Lokal ayarlar</h2><p>Dil, tema, səs, vibrasiya və musiqi Telegram WebView daxilində cihazda saxlanıla bilər.</p>
<h2>3. Məqsəd</h2><p>Avtorizasiya, tərəqqinin saxlanması, reytinq, sikkələrin hesablanması, təkrar mükafat və ödənişlərin qarşısının alınması, referral və mağaza funksiyaları.</p>
<h2>4. Xidmətlər</h2><p>Oyun Telegram daxilində işləyir. Server məlumatları Supabase-də saxlanılır, statik fayllar GitHub Pages vasitəsilə yayımlanır. Reklam şəbəkəsi hələ qoşulmayıb.</p>
<h2>5. Reytinq</h2><p>Reytinqdə oyun/Telegram adı, PhotoWord ID, XP və tərəqqi görünə bilər. Telegram ID açıq göstərilmir.</p>
<h2>6. Təhlükəsizlik</h2><p>Server Telegram initData imzasını yoxlayır. Ödənişli sikkələr yalnız Telegram Stars ödənişi server tərəfindən təsdiqləndikdən sonra verilir.</p>
<h2>7. Bildirişlər</h2><p>Bot yalnız Telegram sistem icazəsi verildikdən sonra istifadəçiyə yaza bilər.</p>
<h2>8. Tərəqqinin sıfırlanması</h2><p>Səviyyələr, XP və reytinq mövqeyi silinir və oyun 1-ci səviyyədən başlayır. Sikkələr, Stars alış tarixçəsi və artıq alınmış mükafat tarixçəsi saxlanılır.</p>
<h2>9. Hesabın silinməsi</h2><p>Tam hesab silmə mexanizmi ictimai buraxılışdan əvvəl əlavə ediləcək. Dəstək əlaqəsi də buraxılışdan əvvəl göstəriləcək.</p>
<h2>10. Dəyişikliklər</h2><p>Yeni funksiyalar, reklam, analitika və ya ödəniş üsulları əlavə ediləndə siyasət yenilənə bilər.</p>`}};
