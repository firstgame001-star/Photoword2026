const L={"ru":{"t":"Политика конфиденциальности","d":"Обновлено 07.10.2026","c":"<section><h2>1. Контакт проекта</h2><p>PhotoWord — игра в Telegram. По вопросам данных и работы игры обращайся в @PhotoWordBot через /support. По вопросам покупок — /paysupport.</p><p>Контактная почта для вопросов об игре, покупках и персональных данных: <a href=\"mailto:firstgame001@mail.ru\">firstgame001@mail.ru</a>.</p></section><section><h2>2. Какие данные сохраняются</h2><p>Telegram ID, имя и username из подписанных данных Telegram, внутренний PhotoWord ID и игровой ник. Также сохраняются прогресс глав и тем, монеты, XP, энергия, достижения, рамки, результаты испытаний и дуэлей, друзья, реферальные связи и ежедневные награды. Для Stars сохраняются идентификаторы платежей, пакет и сумма. Данные банковских карт PhotoWord не получает. Обращения в поддержку могут содержать текст и сведения о приложенных скриншотах.</p></section><section><h2>3. Для чего нужны данные</h2><p>Для входа, синхронизации между устройствами, игровых наград и покупок, проверки результатов, защиты от повторных выплат, поддержки и уведомлений. Диагностические события включают открытия экранов, результаты, подсказки и ошибки приложения. Не отправляй в поддержку пароли, коды входа и банковские реквизиты.</p></section><section><h2>4. Что видно другим игрокам</h2><p>В рейтинге, друзьях и дуэлях могут отображаться игровое имя или Telegram-имя, PhotoWord ID, ранг, XP, прогресс и выбранная рамка. Telegram ID не публикуется в игровом интерфейсе.</p></section><section><h2>5. Сервисы и устройство</h2><p>Telegram обеспечивает вход и платежи Stars; игровые данные хранятся в Supabase, сайт размещён на GitHub Pages. При добровольном просмотре рекламы AdsGram обрабатывает данные для показа и подтверждения награды. Эти сервисы применяют собственные условия. Язык, оформление и часть игровых настроек хранятся на устройстве. Данные могут обрабатываться на инфраструктуре этих сервисов за пределами твоей страны.</p></section><section><h2>6. Уведомления</h2><p>Рассылки настраиваются в игре: общий переключатель, ежедневная награда, восстановление энергии и открытие главы. Служебные ответы на обращения и подтверждения платежей приходят в чат бота. Бота также можно остановить средствами Telegram.</p></section><section><h2>7. Сброс и удаление — разные действия</h2><p>«Начать заново» сбрасывает игровой прогресс, ник и настройки, возвращает 250 монет и 5/5 энергии. Контакты друзей и платёжные записи остаются. «Удалить аккаунт» удаляет профиль PhotoWord и связанные данные на сервере: прогресс, балансы, достижения, историю наград и покупок, обращения в поддержку и игровые события. Локальные данные PhotoWord на текущем устройстве очищаются. При новом запуске создаётся новый профиль. Другие устройства могут показывать старый экран до обновления; локальные данные на них можно очистить в Telegram. Удаление не удаляет Telegram-аккаунт и чеки Telegram, не отменяет платежи и не выдаёт возврат Stars. Во время активной дуэли взнос соперника возвращается.</p></section><section><h2>8. Срок хранения и обращения</h2><p>Рабочие игровые данные сохраняются, пока существует профиль, и удаляются по команде «Удалить аккаунт». Копии и журналы на стороне Telegram и других сервисов управляются этими сервисами; команда не удаляет их из инфраструктуры третьих сторон. Для вопросов о данных или проблем с удалением используй /support. Версия политики меняется вместе с функциями игры.</p></section>"},"en":{"t":"Privacy Policy","d":"Updated 7 Oct 2026","c":"<section><h2>1. Project contact</h2><p>PhotoWord is a Telegram game. Contact @PhotoWordBot using /support for data and game questions, or /paysupport for purchases.</p><p>Contact email for game, purchase and personal data questions: <a href=\"mailto:firstgame001@mail.ru\">firstgame001@mail.ru</a>.</p></section><section><h2>2. Data stored</h2><p>Telegram ID, name and username from signed Telegram data, an internal PhotoWord ID and game nickname. We store chapter and theme progress, coins, XP, energy, achievements, frames, challenge and duel results, friends, referrals and daily rewards. Stars records include payment identifiers, pack and amount. PhotoWord does not receive bank card details. Support requests may contain text and references to attached screenshots.</p></section><section><h2>3. Purposes</h2><p>Login, synchronization across devices, game rewards and purchases, result verification, duplicate-payment prevention, support and notifications. Diagnostic events include screen opens, results, hints and app errors. Do not send passwords, login codes or bank details to support.</p></section><section><h2>4. Public game information</h2><p>Leaderboards, friends and duels may display your game or Telegram name, PhotoWord ID, rank, XP, progress and selected frame. Your Telegram ID is not published in the game interface.</p></section><section><h2>5. Services and local storage</h2><p>Telegram provides login and Stars payments; game data is stored in Supabase and the site is hosted on GitHub Pages. When you voluntarily watch an ad, AdsGram processes data to serve it and confirm the reward. These services apply their own terms. Language, appearance and some game preferences are stored on your device. Service infrastructure may process data outside your country.</p></section><section><h2>6. Notifications</h2><p>The game offers a master switch and reminders for daily rewards, restored energy and unlocked chapters. Support replies and payment confirmations arrive in the bot chat. You can also stop the bot in Telegram.</p></section><section><h2>7. Reset and deletion are different</h2><p>Start over resets gameplay, nickname and preferences, restores 250 coins and 5/5 energy, and retains friend contacts and payment records. Delete account removes the PhotoWord profile and related server data: progress, balances, achievements, reward and purchase history, support requests and game events. Local PhotoWord data on this device is cleared. Opening the game again creates a new profile. Other devices may show a stale screen until refreshed; their local data can be cleared in Telegram. Deletion does not delete your Telegram account or Telegram receipts, cancel payments or refund Stars. An opponent’s held stake is refunded if you delete during an active duel.</p></section><section><h2>8. Retention and requests</h2><p>Operational game data is retained while the profile exists and deleted through Delete account. Copies and logs held by Telegram and other services are managed by those services; this command does not erase data from third-party infrastructure. Use /support for data questions or deletion problems. The policy version changes as game features change.</p></section>"},"az":{"t":"Məxfilik siyasəti","d":"Yenilənib: 07.10.2026","c":"<section><h2>1. Layihə ilə əlaqə</h2><p>PhotoWord Telegram oyunudur. Məlumatlar və oyun barədə @PhotoWordBot botuna /support, alış barədə /paysupport ilə müraciət et.</p><p>Oyun, alışlar və şəxsi məlumatlarla bağlı əlaqə e-poçtu: <a href=\"mailto:firstgame001@mail.ru\">firstgame001@mail.ru</a>.</p></section><section><h2>2. Saxlanılan məlumatlar</h2><p>İmzalanmış Telegram məlumatlarından Telegram ID, ad və istifadəçi adı, daxili PhotoWord ID və oyun niki saxlanılır. Fəsil və mövzu tərəqqisi, sikkələr, XP, enerji, nailiyyətlər, çərçivələr, sınaq və duel nəticələri, dostlar, dəvətlər və gündəlik mükafatlar da saxlanılır. Stars qeydlərinə ödəniş identifikatoru, paket və məbləğ daxildir. PhotoWord bank kartı məlumatlarını almır. Dəstək müraciətlərində mətn və əlavə edilmiş ekran görüntüləri barədə məlumat ola bilər.</p></section><section><h2>3. Məqsədlər</h2><p>Giriş, cihazlar arasında sinxronizasiya, mükafatlar və alışlar, nəticələrin yoxlanması, təkrar ödənişlərin qarşısının alınması, dəstək və bildirişlər. Diaqnostika ekran açılışları, nəticələr, ipucları və tətbiq səhvlərini əhatə edir. Dəstəyə şifrə, giriş kodu və bank məlumatı göndərmə.</p></section><section><h2>4. Digər oyunçuların gördükləri</h2><p>Reytinqdə, dostlarda və duellərdə oyun və ya Telegram adı, PhotoWord ID, rütbə, XP, tərəqqi və seçilmiş çərçivə görünə bilər. Telegram ID oyun interfeysində dərc edilmir.</p></section><section><h2>5. Xidmətlər və cihaz</h2><p>Telegram giriş və Stars ödənişlərini təmin edir; oyun məlumatları Supabase-də, sayt GitHub Pages-də yerləşir. Könüllü reklam baxışı zamanı AdsGram reklamı göstərmək və mükafatı təsdiqləmək üçün məlumatları emal edir. Bu xidmətlərin öz şərtləri var. Dil, görünüş və bəzi ayarlar cihazda saxlanılır. Məlumatlar ölkəndən kənardakı infrastrukturda emal edilə bilər.</p></section><section><h2>6. Bildirişlər</h2><p>Oyunda ümumi keçid və gündəlik mükafat, bərpa olunmuş enerji, açılmış fəsil bildirişləri var. Dəstək cavabları və ödəniş təsdiqləri bot çatına gəlir. Telegram-da botu da dayandıra bilərsən.</p></section><section><h2>7. Sıfırlama və silinmə fərqlidir</h2><p>Yenidən başla oyun tərəqqisini, niki və ayarları sıfırlayır, 250 sikkə və 5/5 enerji verir; dostlar və ödəniş qeydləri qalır. Hesabı sil PhotoWord profilini və əlaqəli server məlumatlarını — tərəqqi, balans, nailiyyətlər, mükafat və alış tarixçəsi, dəstək müraciətləri və oyun hadisələrini silir. Bu cihazdakı lokal PhotoWord məlumatları təmizlənir. Oyunu yenidən açdıqda yeni profil yaranır. Digər cihazlarda yenilənənədək köhnə ekran görünə bilər; onların lokal məlumatları Telegram-da təmizlənə bilər. Silinmə Telegram hesabını və qəbzlərini silmir, ödənişləri ləğv etmir və Stars qaytarmır. Aktiv dueldə rəqibin giriş məbləği geri qaytarılır.</p></section><section><h2>8. Saxlanma və müraciətlər</h2><p>İşlək oyun məlumatları profil mövcud olduqca saxlanılır və Hesabı sil ilə silinir. Telegram və digər xidmətlərin nüsxə və jurnallarını həmin xidmətlər idarə edir; bu əmr üçüncü tərəf infrastrukturundakı məlumatları silmir. Məlumat və silinmə problemləri üçün /support istifadə et. Oyun funksiyaları dəyişdikcə siyasət yenilənir.</p></section>"}};
