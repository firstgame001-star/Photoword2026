const L={"ru":{"t":"Пользовательское соглашение","d":"Обновлено 07.10.2026","c":"<section><h2>1. Игра и аккаунт</h2><p>PhotoWord — игра «четыре подсказки, одно слово» внутри Telegram. Прогресс привязан к Telegram-аккаунту. Соблюдай правила Telegram и правила игры. Политика конфиденциальности описывает обработку данных.</p></section><section><h2>2. Монеты, XP и покупки</h2><p>Монеты, энергия и XP используются только в игре, не являются деньгами и не выводятся. Пакет и цена Stars показываются до оплаты. Начисление выполняется после подтверждения Telegram. Если покупка не появилась, не оплачивай её повторно: обратись через /paysupport и приложи чек. Вопросы о доставке покупок и возврате направляй PhotoWord, а не поддержке Telegram. Возврат рассматривается по конкретному платежу; автоматического возврата при сбросе или удалении нет.</p></section><section><h2>3. Реклама и награды</h2><p>Просмотр рекламы добровольный. Бонус выдаётся после подтверждения завершённого просмотра; при отсутствии рекламы или прерванном просмотре он может быть недоступен. Повторное прохождение уже оплаченного уровня не даёт повторную награду. Лимиты и стоимость подсказок показаны в игре.</p></section><section><h2>4. Дуэли и честная игра</h2><p>Оба участника оплачивают показанный взнос. Победитель получает 90% общего банка; при ничьей взносы возвращаются. Отмена комнаты до присоединения соперника возвращает взнос. Подделка платежей, обход лимитов, автоматическая накрутка и вмешательство в сервер запрещены. Проверка результатов и начисления выполняются сервером.</p></section><section><h2>5. Сброс, удаление и изменения</h2><p>Сброс начинает игру заново с 250 монетами и 5/5 энергии; покупки не начисляются повторно. Удаление аккаунта необратимо и уничтожает связанные данные PhotoWord; Telegram-аккаунт остаётся. Сначала реши вопросы по спорным покупкам с поддержкой. Контент и механики могут обновляться; актуальные значения указаны в интерфейсе и правилах.</p></section><section><h2>6. Поддержка</h2><p>@PhotoWordBot: /support — ошибки и данные, /paysupport — покупки, /cancel — выйти из ввода обращения. Опиши проблему, режим и уровень; для оплаты укажи дату, пакет и чек. Не отправляй пароли и коды. Принятое обращение получает номер; срок ответа не гарантируется.</p><p>Контактная почта для вопросов об игре, покупках и персональных данных: <a href=\"mailto:firstgame001@mail.ru\">firstgame001@mail.ru</a>.</p></section>"},"en":{"t":"Terms of Use","d":"Updated 7 Oct 2026","c":"<section><h2>1. Game and account</h2><p>PhotoWord is a four-clue word game inside Telegram. Progress is linked to your Telegram account. Follow Telegram and game rules. The Privacy Policy explains data processing.</p></section><section><h2>2. Coins, XP and purchases</h2><p>Coins, energy and XP are for game use, are not money and cannot be withdrawn. The pack and Stars price appear before payment. Credits follow Telegram confirmation. If a purchase is missing, do not pay again: use /paysupport and provide the receipt. Contact PhotoWord, rather than Telegram support, about delivery and refunds. Refund requests are reviewed for the specific payment; reset or deletion does not automatically refund purchases.</p></section><section><h2>3. Ads and rewards</h2><p>Watching ads is optional. Bonuses require confirmation of a completed view; no ad availability or an interrupted view may prevent a reward. Replaying an already rewarded level gives no additional reward. Limits and hint prices are displayed in the game.</p></section><section><h2>4. Duels and fair play</h2><p>Both players pay the displayed entry. The winner receives 90% of the total pot; draws refund both entries. Canceling before an opponent joins refunds the entry. Falsifying payments, bypassing limits, automated farming and server interference are prohibited. Results and credits are verified by the server.</p></section><section><h2>5. Reset, deletion and updates</h2><p>Reset starts a new game with 250 coins and 5/5 energy; past purchases are not credited again. Account deletion is irreversible and removes related PhotoWord data; your Telegram account remains. Resolve disputed purchases with support first. Content and mechanics may change; current values are shown in the interface and game rules.</p></section><section><h2>6. Support</h2><p>@PhotoWordBot: /support for errors and data, /paysupport for purchases, /cancel to leave request entry. Describe the issue, mode and level; include purchase date, pack and receipt for payment issues. Do not send passwords or login codes. Accepted requests receive a reference number; response time is not guaranteed.</p><p>Contact email for game, purchase and personal data questions: <a href=\"mailto:firstgame001@mail.ru\">firstgame001@mail.ru</a>.</p></section>"},"az":{"t":"İstifadəçi razılaşması","d":"Yenilənib: 07.10.2026","c":"<section><h2>1. Oyun və hesab</h2><p>PhotoWord Telegram daxilində dörd ipucundan bir söz tapma oyunudur. Tərəqqi Telegram hesabına bağlıdır. Telegram və oyun qaydalarına riayət et. Məxfilik siyasəti məlumatların emalını izah edir.</p></section><section><h2>2. Sikkələr, XP və alışlar</h2><p>Sikkələr, enerji və XP yalnız oyunda istifadə olunur, pul deyil və çıxarıla bilməz. Paket və Stars qiyməti ödənişdən əvvəl göstərilir. Əlavə etmə Telegram təsdiqindən sonra baş verir. Alış görünmürsə yenidən ödəmə: /paysupport ilə qəbzi göndər. Alışın verilməsi və geri qaytarılması barədə Telegram dəstəyinə deyil, PhotoWord-a yaz. Geri qaytarma konkret ödəniş üzrə araşdırılır; sıfırlama və silinmə avtomatik geri ödəniş yaratmır.</p></section><section><h2>3. Reklam və mükafatlar</h2><p>Reklama baxmaq könüllüdür. Bonus tamamlanmış baxış təsdiqləndikdən sonra verilir; reklam yoxdursa və ya baxış yarımçıqdırsa mükafat olmaya bilər. Mükafatı alınmış səviyyəni təkrar keçmək əlavə mükafat vermir. Limitlər və ipucu qiymətləri oyunda göstərilir.</p></section><section><h2>4. Duellər və dürüst oyun</h2><p>Hər iki oyunçu göstərilən giriş məbləğini ödəyir. Qalib ümumi bankın 90%-ni alır; heç-heçədə hər iki ödəniş qaytarılır. Rəqib qoşulmazdan əvvəl otağı ləğv etmək ödənişi qaytarır. Ödəniş saxtalaşdırmaq, limitləri keçmək, avtomatik mükafat toplamaq və serverə müdaxilə qadağandır. Nəticələri və ödənişləri server yoxlayır.</p></section><section><h2>5. Sıfırlama, silinmə və yeniliklər</h2><p>Sıfırlama 250 sikkə və 5/5 enerji ilə yeni oyun başlayır; əvvəlki alışlar yenidən verilmir. Hesabın silinməsi geri qaytarılmır və əlaqəli PhotoWord məlumatlarını silir; Telegram hesabı qalır. Mübahisəli alışları əvvəlcə dəstəklə həll et. Məzmun və mexanikalar dəyişə bilər; cari dəyərlər interfeysdə və oyun qaydalarında göstərilir.</p></section><section><h2>6. Dəstək</h2><p>@PhotoWordBot: səhvlər və məlumatlar üçün /support, alışlar üçün /paysupport, müraciətdən çıxmaq üçün /cancel. Problemi, rejimi və səviyyəni göstər; ödəniş üçün tarix, paket və qəbz əlavə et. Şifrə və giriş kodu göndərmə. Qəbul edilmiş müraciət nömrə alır; cavab vaxtına zəmanət verilmir.</p><p>Oyun, alışlar və şəxsi məlumatlarla bağlı əlaqə e-poçtu: <a href=\"mailto:firstgame001@mail.ru\">firstgame001@mail.ru</a>.</p></section>"}};
